<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopwatch</title>
  <link rel="stylesheet" href="/study-tracker-project/frontend/style.css">
  <script src="https://kit.fontawesome.com/4391f2c1dc.js" crossorigin="anonymous"></script>
</head>
<body>

  <!--Bubble effect -->
  <div class="bubble-wrapper">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>

  <div class="form-container">

    <!--Sing in-->
    <form class="signin-form">
      <h2 class="form-header">Sign in</h2>
      <div class="input-container">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" placeholder="Email" class="form-input" required>
      </div>
      <div class="input-container">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="Password" class="form-input" required>
      </div>
      <button class="form-submit-button" type="submit">Log In</button>
      <p>Don't have an account yet? <a href="#" id="signup-link">Sign up</a> </p>
    </form>



    <!--Sign up-->
    <form class="signup-form hidden">
      <h2 class="form-header">Sign Up</h2>
      <div class="input-container">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" placeholder="Email" class="form-input" required>
      </div>
      <div class="input-container">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="Password" class="form-input" id="user-password" required>
      </div>
      <div class="input-container">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="Confirm Password" class="form-input" id="user-confirm-password" required>
      </div>
      <button class="form-submit-button" type="submit">Create Account</button>
      <p>Already have an account? <a href="#" id="signin-link">Log In</a> </p>
    </form>


  </div>
 


  <script src="/study-tracker-project/frontend/login-signup.js"></script>
</body>
</html>
